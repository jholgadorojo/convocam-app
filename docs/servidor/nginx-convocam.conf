# /etc/nginx/sites-available/convocam (enlazado en sites-enabled)
# Versión previa a certbot: `certbot --nginx -d convocam.duckdns.org` añade al
# servidor el bloque listen 443 con el certificado y la redirección de HTTP a HTTPS.
server {
    listen 80;
    server_name convocam.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sin buffer para que funcione el streaming (loading.tsx)
        proxy_buffering off;
    }
}
